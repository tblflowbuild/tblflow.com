name: CI

# Le déploiement est fait par Cloudflare Workers Builds ; ce workflow ne fait que vérifier.
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run check:typo-fr
      - run: npx astro check
      - run: node scripts/check-meta.mjs
      - run: node scripts/check-pricing.mjs
      - run: node scripts/check-trust.mjs
      # Warning only: the 90-day freshness of the comparisons is checked by hand before each publication.
      - run: node scripts/check-compare.mjs
        continue-on-error: true
